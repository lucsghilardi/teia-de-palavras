<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Bairro visto de cima">
  <rect width="800" height="600" fill="#1f5f3a"/>
  <rect x="0" y="0" width="800" height="600" fill="url(#g)"/>
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#22673f"/>
      <circle cx="20" cy="20" r="2" fill="#2c7a4c"/>
    </pattern>
  </defs>
  <!-- rio -->
  <path d="M 0 470 C 120 430, 200 520, 320 480 S 520 420, 800 470 L 800 520 C 520 470, 420 540, 320 530 S 120 480, 0 520 Z" fill="#2563eb" opacity="0.8"/>
  <!-- quadras -->
  <rect x="40" y="40" width="220" height="130" rx="14" fill="#c4b5fd"/>
  <rect x="300" y="40" width="200" height="130" rx="14" fill="#fde68a"/>
  <rect x="540" y="40" width="220" height="130" rx="14" fill="#f9a8d4"/>
  <rect x="40" y="210" width="220" height="150" rx="14" fill="#fdba74"/>
  <rect x="300" y="210" width="200" height="150" rx="14" fill="#a7f3d0"/>
  <rect x="540" y="210" width="220" height="150" rx="14" fill="#93c5fd"/>
  <rect x="40" y="400" width="220" height="50" rx="14" fill="#bbf7d0"/>
  <rect x="540" y="400" width="220" height="50" rx="14" fill="#fecaca"/>
  <rect x="40" y="540" width="220" height="40" rx="14" fill="#c4b5fd"/>
  <rect x="540" y="540" width="220" height="40" rx="14" fill="#fde68a"/>
  <!-- ruas -->
  <rect x="0" y="176" width="800" height="28" fill="#334155"/>
  <rect x="0" y="366" width="800" height="28" fill="#334155"/>
  <rect x="266" y="0" width="28" height="600" fill="#334155"/>
  <rect x="506" y="0" width="28" height="600" fill="#334155"/>
  <g stroke="#f8fafc" stroke-width="4" stroke-dasharray="18 14">
    <line x1="0" y1="190" x2="800" y2="190"/>
    <line x1="0" y1="380" x2="800" y2="380"/>
    <line x1="280" y1="0" x2="280" y2="600"/>
    <line x1="520" y1="0" x2="520" y2="600"/>
  </g>
  <!-- faixa de pedestre -->
  <g fill="#f8fafc">
    <rect x="300" y="178" width="8" height="24"/><rect x="316" y="178" width="8" height="24"/><rect x="332" y="178" width="8" height="24"/><rect x="348" y="178" width="8" height="24"/>
  </g>
  <!-- árvores da praça -->
  <g fill="#15803d">
    <circle cx="110" cy="455" r="26"/><circle cx="170" cy="440" r="22"/><circle cx="220" cy="460" r="24"/><circle cx="80" cy="430" r="18"/>
  </g>
  <!-- prédios simples -->
  <g fill="#0f172a" opacity="0.18">
    <rect x="70" y="60" width="60" height="40" rx="6"/><rect x="150" y="60" width="90" height="40" rx="6"/>
    <rect x="570" y="60" width="70" height="40" rx="6"/><rect x="660" y="60" width="80" height="40" rx="6"/>
    <rect x="330" y="240" width="70" height="60" rx="6"/><rect x="420" y="240" width="60" height="60" rx="6"/>
    <rect x="580" y="240" width="140" height="60" rx="6"/>
  </g>
