<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Escola vista de cima">
  <rect width="800" height="600" fill="#e2e8f0"/>
  <!-- muro -->
  <rect x="20" y="20" width="760" height="560" rx="24" fill="none" stroke="#94a3b8" stroke-width="10"/>
  <!-- prédio principal -->
  <rect x="60" y="60" width="440" height="200" rx="16" fill="#fca5a5"/>
  <g fill="#7f1d1d" opacity="0.25">
    <rect x="90" y="90" width="80" height="60" rx="8"/><rect x="200" y="90" width="80" height="60" rx="8"/><rect x="310" y="90" width="80" height="60" rx="8"/>
    <rect x="90" y="170" width="80" height="60" rx="8"/><rect x="200" y="170" width="80" height="60" rx="8"/><rect x="310" y="170" width="80" height="60" rx="8"/>
  </g>
  <!-- pátio -->
  <rect x="60" y="300" width="440" height="240" rx="16" fill="#cbd5e1"/>
  <!-- quadra -->
  <rect x="540" y="60" width="200" height="300" rx="12" fill="#fb923c"/>
  <rect x="560" y="80" width="160" height="260" rx="8" fill="none" stroke="#fff7ed" stroke-width="5"/>
  <line x1="560" y1="210" x2="720" y2="210" stroke="#fff7ed" stroke-width="5"/>
  <circle cx="640" cy="210" r="30" fill="none" stroke="#fff7ed" stroke-width="5"/>
  <!-- jardim -->
  <rect x="540" y="400" width="200" height="140" rx="16" fill="#86efac"/>
  <g fill="#15803d">
    <circle cx="590" cy="450" r="24"/><circle cx="650" cy="480" r="28"/><circle cx="700" cy="440" r="20"/>
  </g>
  <!-- portão -->
  <rect x="380" y="546" width="80" height="20" rx="6" fill="#facc15"/>
  <!-- bebedouro / cantina -->
  <rect x="80" y="330" width="100" height="60" rx="10" fill="#93c5fd"/>
  <rect x="380" y="330" width="100" height="60" rx="10" fill="#fde68a"/>
</svg>
