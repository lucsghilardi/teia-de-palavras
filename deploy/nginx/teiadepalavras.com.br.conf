# Vhost do nginx do HOST (a VPS) para teiadepalavras.com.br; o TLS termina aqui
# e os containers só escutam no loopback. Não instale à mão: o
# deploy/ativar-https.sh troca __REVERB_APP_KEY__ pela chave do .env, testa
# (nginx -t) e instala em /etc/nginx/sites-available quando o certificado existe.
# O deploy.sh roda o mesmo script, então mudar este arquivo no git chega à VPS.
#
# Quem atende cada caminho:
#   /app/<chave>   websocket do Reverb    -> nginx do backend (127.0.0.1:8003)
#   /storage/      mídia das aulas        -> nginx do backend
#   /api/vozes/    voz neural (mp3)       -> nginx do backend
#   todo o resto   Next: painel, app da criança e os proxies /api/proxy,
#                  /api/crianca-proxy e /api/auth -> 127.0.0.1:3005
#
# O app da criança também mora em /app/* (/app/entrar, /app/roda...): por isso o
# Reverb recebe SÓ o caminho exato da chave, e nunca um `location /app`.
# Sem `http2` no listen de propósito: no nginx 1.24 da VPS ele vale para o
# socket inteiro e mudaria os outros sites que dividem a porta 443.

# HTTP -> HTTPS no endereço canônico. O certbot (--nginx) faz a renovação por
# este bloco.
server {
    listen 80;
    listen [::]:80;
    server_name teiadepalavras.com.br www.teiadepalavras.com.br;

    location / {
        return 301 https://teiadepalavras.com.br$request_uri;
    }
}

# www -> apex. Os cookies de sessão (httpOnly, sem `domain`) valem para um host
# só; com um endereço canônico ninguém fica logado num e deslogado no outro.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.teiadepalavras.com.br;

    ssl_certificate     /etc/letsencrypt/live/teiadepalavras.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teiadepalavras.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://teiadepalavras.com.br$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name teiadepalavras.com.br;

    ssl_certificate     /etc/letsencrypt/live/teiadepalavras.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teiadepalavras.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Upload de imagem/áudio das aulas: igual ao nginx do backend e ao php/uploads.ini.
    client_max_body_size 64M;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Herdados pelos locations que não definem proxy_set_header próprio. O Next
    # monta redirects a partir do Host/X-Forwarded-*; o Laravel limita por IP
    # com o X-Forwarded-For.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Reverb (protocolo Pusher). O navegador conecta em wss://<site>/app/<chave>.
    location = /app/__REVERB_APP_KEY__ {
        proxy_pass http://127.0.0.1:8003;
        # Definir qualquer proxy_set_header aqui anula os herdados: repetir todos.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location ^~ /storage/ {
        proxy_pass http://127.0.0.1:8003;
    }

    location ^~ /api/vozes/ {
        proxy_pass http://127.0.0.1:8003;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
    }

    access_log /var/log/nginx/teia_access.log;
    error_log  /var/log/nginx/teia_error.log;
}
