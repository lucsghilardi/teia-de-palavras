# Nginx interno do container `backend` (produção). Só o Next (proxy interno) e
# o nginx do host (websocket em /app) o alcançam. TLS é do host.

server {
    listen 80;
    server_name _;

    root /var/www/laravel/public;
    index index.php;

    charset utf-8;

    # DNS embutido do Docker: com `fastcgi_pass php:9000` literal o nginx
    # resolve o nome só no boot e guarda o IP; quando o container php é
    # recriado no deploy, ele ganha IP novo e tudo vira 502. Via variável a
    # resolução acompanha a troca.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Upload de imagem/áudio das aulas e gravações — bater com php/uploads.ini
    # e com o client_max_body_size do vhost do host.
    client_max_body_size 64M;

    # WebSocket do Laravel Reverb. O navegador conecta em /app/{key} (protocolo
    # Pusher) e o nginx repassa para o serviço reverb na rede interna.
    location /app {
        set $reverb_upstream http://reverb:8080;
        proxy_pass $reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include fastcgi_params;
        set $php_upstream php:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /var/log/nginx/laravel_error.log;
    access_log /var/log/nginx/laravel_access.log;
}
